<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="card">
      <div class="image">
        <img src="images/perfume.jpg" alt="perfume picture" />
      </div>
      <div class="content">
        <p class="category">PERFUME</p>
        <h1>
          Gabrielle <br />
          Essence Eau <br />De Parfum
        </h1>
        <p class="description">
          A floral, solar and voluptuous interpretation composed by Oliver
          Polge, Perfumer-Creator for the House of CHANEL
        </p>
        <div class="Price">
          <span class="New_price">$149.99</span>
          <span class="old_price">$169.99</span>
          <button><span>🛒</span>Add to Cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
